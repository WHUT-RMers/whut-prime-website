<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/static/favicon.png?v=3" />
    <title>WHUT PRIME — 武汉理工大学机甲大师 PRIME 战队 · 2027 赛季</title>
    <meta name="description" content="武汉理工大学机甲大师 PRIME 战队官网（2027 赛季）。精研 · 覃思 · 笃志 · 力行。赛事介绍、战队资讯、历史荣誉、组别与技术栈、简历投递、商业合作。" />
    <script>
      // 首屏主题防闪烁：渲染前从 localStorage / 系统偏好决定主题
      ;(function () {
        var t;
        try {
          var s = localStorage.getItem('whut-prime-theme');
          t = s === 'dark' || s === 'light'
            ? s
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        } catch (e) { t = 'dark' }
        document.documentElement.setAttribute('data-theme', t)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
