<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/static/favicon.png?v=4" />
    <title>WHUT PRIME — 武汉理工大学机甲大师 PRIME 战队 · 2027 赛季</title>
    <meta name="description" content="武汉理工大学机甲大师 PRIME 战队官网（2027 赛季）。精研 · 覃思 · 笃志 · 力行。赛事介绍、战队资讯、历史荣誉、组别与技术栈、简历投递、商业合作。" />
    <script>
      // 首屏主题防闪烁：默认深色；用户手动切换（localStorage）后以用户选择为准
      ;(function () {
        var t = 'dark';
        try {
          var s = localStorage.getItem('whut-prime-theme');
          if (s === 'dark' || s === 'light') t = s;
        } catch (e) { /* 隐私模式忽略 */ }
        document.documentElement.setAttribute('data-theme', t)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
